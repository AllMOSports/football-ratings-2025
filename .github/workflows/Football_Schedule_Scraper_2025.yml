name: Scrape Football Schedule (2025)
 
on:
  schedule:
    # Runs daily at 9:00 AM UTC (~3-4 AM Central, depending on DST) during
    # the season. Adjust the cron or add/remove entries as needed.
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
 
permissions:
  contents: write   # needed so the workflow can commit the output CSV back
 
jobs:
  scrape:
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas
 
      - name: Run schedule scraper
        run: python football_schedule_scraper_2025.py
 
      - name: Commit and push CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_scoreboard_2025.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football_scoreboard_2025.csv [automated]"
            git push
          fi
 
